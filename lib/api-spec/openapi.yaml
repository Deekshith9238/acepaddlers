openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Admin authentication and management
  - name: content
    description: Public content (destinations, tours, blog, gallery)
  - name: booking
    description: Booking engine (availability and request-to-book)
  - name: crm
    description: Enquiry pipeline and customer records
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      description: Authenticate an admin and start a session (sets an httpOnly cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      description: End the current admin session and clear the cookie.
      responses:
        "204":
          description: Logged out
  /admin/auth/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Current admin
      description: Returns the currently authenticated admin user.
      responses:
        "200":
          description: Current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
  /destinations:
    get:
      operationId: listDestinations
      tags: [content]
      summary: List published destinations
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
  /destinations/{slug}:
    get:
      operationId: getDestination
      tags: [content]
      summary: Get a destination by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Not found
  /tours:
    get:
      operationId: listTours
      tags: [content]
      summary: List published tours
      parameters:
        - name: destination
          in: query
          required: false
          schema:
            type: string
          description: Filter by destination slug
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [rafting, camping, homestay, water_sports]
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [activity, accommodation, package]
          description: Filter by destination section
      responses:
        "200":
          description: Tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
  /tours/{slug}:
    get:
      operationId: getTour
      tags: [content]
      summary: Get a tour by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Not found
  /blog:
    get:
      operationId: listBlogPosts
      tags: [content]
      summary: List published blog posts
      responses:
        "200":
          description: Blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPostSummary"
  /blog/{slug}:
    get:
      operationId: getBlogPost
      tags: [content]
      summary: Get a blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
  /gallery:
    get:
      operationId: listGallery
      tags: [content]
      summary: List published gallery items
      responses:
        "200":
          description: Gallery items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryItem"
  /tour-types:
    get:
      operationId: listTourTypes
      tags: [content]
      summary: List tour types (activity categories like Rafting, Camping)
      responses:
        "200":
          description: Tour types
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TourType" } }
  /tour-categories:
    get:
      operationId: listTourCategories
      tags: [content]
      summary: List tour categories (activity / accommodation / package)
      responses:
        "200":
          description: Tour categories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TourCategory" } }
  /admin/tour-types:
    get:
      operationId: listAdminTourTypes
      tags: [admin]
      summary: List all tour types
      responses:
        "200":
          description: Tour types
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TourType" } }
        "401": { description: Not authenticated }
    post:
      operationId: createTourType
      tags: [admin]
      summary: Create a tour type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TourTypeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourType" }
        "409": { description: Slug already exists }
  /admin/tour-types/{id}:
    patch:
      operationId: updateTourType
      tags: [admin]
      summary: Update a tour type
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TourTypeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourType" }
        "404": { description: Not found }
    delete:
      operationId: deleteTourType
      tags: [admin]
      summary: Delete a tour type
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
        "409": { description: Still used by one or more tours }
  /admin/tour-categories:
    get:
      operationId: listAdminTourCategories
      tags: [admin]
      summary: List all tour categories
      responses:
        "200":
          description: Tour categories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TourCategory" } }
        "401": { description: Not authenticated }
    post:
      operationId: createTourCategory
      tags: [admin]
      summary: Create a tour category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TourCategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourCategory" }
        "409": { description: Slug already exists }
  /admin/tour-categories/{id}:
    patch:
      operationId: updateTourCategory
      tags: [admin]
      summary: Update a tour category
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TourCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourCategory" }
        "404": { description: Not found }
    delete:
      operationId: deleteTourCategory
      tags: [admin]
      summary: Delete a tour category
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
        "409": { description: Still used by one or more tours }
  /admin/destinations:
    get:
      operationId: listAdminDestinations
      tags: [admin]
      summary: List all destinations (incl. drafts)
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Destination" } }
        "401": { description: Not authenticated }
    post:
      operationId: createDestination
      tags: [admin]
      summary: Create a destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destination" }
        "409": { description: Slug already exists }
  /admin/destinations/{id}:
    patch:
      operationId: updateDestination
      tags: [admin]
      summary: Update a destination
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destination" }
        "404": { description: Not found }
    delete:
      operationId: deleteDestination
      tags: [admin]
      summary: Delete a destination
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/tours:
    get:
      operationId: listAdminTours
      tags: [admin]
      summary: List all tours (incl. drafts)
      responses:
        "200":
          description: Tours
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Tour" } }
        "401": { description: Not authenticated }
    post:
      operationId: createTour
      tags: [admin]
      summary: Create a tour
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TourInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tour" }
        "409": { description: Slug already exists }
  /admin/tours/{id}:
    patch:
      operationId: updateTour
      tags: [admin]
      summary: Update a tour
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TourInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tour" }
        "404": { description: Not found }
    delete:
      operationId: deleteTour
      tags: [admin]
      summary: Delete a tour
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/blog:
    get:
      operationId: listAdminBlogPosts
      tags: [admin]
      summary: List all blog posts (incl. drafts)
      responses:
        "200":
          description: Blog posts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BlogPost" } }
        "401": { description: Not authenticated }
    post:
      operationId: createBlogPost
      tags: [admin]
      summary: Create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "409": { description: Slug already exists }
  /admin/blog/{id}:
    patch:
      operationId: updateBlogPost
      tags: [admin]
      summary: Update a blog post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "404": { description: Not found }
    delete:
      operationId: deleteBlogPost
      tags: [admin]
      summary: Delete a blog post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/gallery:
    get:
      operationId: listAdminGallery
      tags: [admin]
      summary: List all gallery items (incl. unpublished)
      responses:
        "200":
          description: Gallery items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GalleryItem" } }
        "401": { description: Not authenticated }
    post:
      operationId: createGalleryItem
      tags: [admin]
      summary: Create a gallery item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GalleryItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryItem" }
  /admin/gallery/{id}:
    patch:
      operationId: updateGalleryItem
      tags: [admin]
      summary: Update a gallery item
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GalleryItemInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryItem" }
        "404": { description: Not found }
    delete:
      operationId: deleteGalleryItem
      tags: [admin]
      summary: Delete a gallery item
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /availability:
    get:
      operationId: getAvailability
      tags: [content]
      summary: Open booking slots for a tour
      parameters:
        - { name: tour, in: query, required: true, schema: { type: string }, description: "Tour slug" }
        - { name: from, in: query, required: false, schema: { type: string }, description: "YYYY-MM-DD (default today)" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "YYYY-MM-DD (default +90d)" }
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Slot" } }
        "404": { description: Tour not found }
  /bookings:
    post:
      operationId: createBooking
      tags: [booking]
      summary: Request a booking (request-to-book)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "404": { description: Slot not found }
        "409": { description: Slot full / not enough capacity }
  /bookings/{ref}:
    get:
      operationId: getBooking
      tags: [booking]
      summary: Look up a booking by reference
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "404": { description: Not found }
  /bookings/{ref}/verify-payment:
    post:
      operationId: verifyBookingPayment
      tags: [booking]
      summary: Verify a Standard Checkout payment signature and mark the booking paid/confirmed
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPaymentInput" }
      responses:
        "200":
          description: Booking, now paid and confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "400": { description: Invalid signature or order/booking mismatch }
        "404": { description: Not found }
  /admin/slots:
    get:
      operationId: listSlots
      tags: [admin]
      summary: List slots for a tour
      parameters:
        - { name: tourId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Slot" } }
        "401": { description: Not authenticated }
  /admin/tours/{id}/slots/generate:
    post:
      operationId: generateSlots
      tags: [admin]
      summary: Generate slots for a tour from a weekday pattern
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSlotsInput" }
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateResult" }
        "404": { description: Tour not found }
  /admin/slots/{id}:
    patch:
      operationId: updateSlot
      tags: [admin]
      summary: Update a slot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlotUpdateInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slot" }
        "404": { description: Not found }
    delete:
      operationId: deleteSlot
      tags: [admin]
      summary: Delete a slot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/slots/bulk-delete:
    post:
      operationId: bulkDeleteSlots
      tags: [admin]
      summary: Delete many slots at once (by ids, or by tour + date range). Skips booked slots.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteSlotsInput" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResult" }
        "400": { description: Invalid }
  /admin/bookings:
    get:
      operationId: listBookings
      tags: [admin]
      summary: List bookings
      parameters:
        - { name: status, in: query, required: false, schema: { type: string }, description: "Booking status, or 'open' for pending+confirmed" }
        - { name: paymentStatus, in: query, required: false, schema: { type: string, enum: [unpaid, deposit, paid, refunded] } }
        - { name: source, in: query, required: false, schema: { type: string } }
        - { name: tourId, in: query, required: false, schema: { type: string } }
        - { name: bookedFrom, in: query, required: false, schema: { type: string }, description: "Booking created on/after (YYYY-MM-DD)" }
        - { name: bookedTo, in: query, required: false, schema: { type: string } }
        - { name: departsFrom, in: query, required: false, schema: { type: string }, description: "Departure date on/after (YYYY-MM-DD)" }
        - { name: departsTo, in: query, required: false, schema: { type: string } }
        - { name: balanceDue, in: query, required: false, schema: { type: boolean }, description: "Only bookings still owing money" }
        - { name: category, in: query, required: false, schema: { type: string }, description: "Tour category slug — VL's \"collections\"" }
        - { name: variantId, in: query, required: false, schema: { type: string } }
        - { name: paymentMethod, in: query, required: false, schema: { type: string } }
        - { name: agentId, in: query, required: false, schema: { type: string }, description: "An agent id, or \"none\" for direct bookings" }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Search ref, name, e-mail or phone" }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BookingDetail" } }
        "401": { description: Not authenticated }
  /admin/integrations/google:
    get:
      operationId: getGoogleIntegration
      tags: [admin]
      summary: Google Calendar connection status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleStatus" }
        "401": { description: Not authenticated }
    delete:
      operationId: disconnectGoogleIntegration
      tags: [admin]
      summary: Disconnect Google Calendar
      responses:
        "204": { description: Disconnected }
  /admin/integrations/razorpay:
    get:
      operationId: getRazorpayIntegration
      tags: [admin]
      summary: Razorpay configuration status (never exposes the secret key)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayStatus" }
        "401": { description: Not authenticated }
  /admin/integrations/whatsapp:
    get:
      operationId: getWhatsAppIntegration
      tags: [admin]
      summary: WhatsApp Cloud API configuration status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppStatus" }
        "401": { description: Not authenticated }
  /admin/payments:
    get:
      operationId: listPayments
      tags: [admin]
      summary: List every payment attempt across every booking (provider-side audit trail)
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PaymentDetail" } }
        "401": { description: Not authenticated }
  /admin/bookings/{id}:
    patch:
      operationId: updateBookingStatus
      tags: [admin]
      summary: Update a booking's status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingStatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "404": { description: Not found }
    delete:
      operationId: deleteBooking
      tags: [admin]
      summary: Permanently delete a booking
      description: Releases slot capacity, cancels any calendar event and open payment link, then removes the booking. Irreversible.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/bookings/{id}/payment-link:
    post:
      operationId: sendPaymentLink
      tags: [admin]
      summary: Create and send a Razorpay payment link for a booking
      description: Creates a Razorpay Payment Link for the booking's total amount and emails/WhatsApps it to the customer.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Payment link created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "404": { description: Not found }
        "409": { description: Booking already paid }
        "501": { description: Razorpay not configured }
  /pages/{slug}:
    get:
      operationId: getPage
      tags: [content]
      summary: Get a published page's builder document
      parameters:

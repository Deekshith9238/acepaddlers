      responses:
        "200":
          description: Coupons
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CouponDetail" } }
        "401": { description: Not authenticated }
    post:
      operationId: createCoupon
      tags: [admin]
      summary: Create a discount code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponInput" }
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponDetail" }
        "409": { description: Code already exists }
  /admin/coupons/bulk:
    post:
      operationId: generateCouponBatch
      tags: [admin]
      summary: Generate a series of unique single-use codes for a partner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponBatchInput" }
      responses:
        "201":
          description: Generated codes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CouponDetail" } }
        "400": { description: Invalid input }
  /admin/coupons/{id}:
    patch:
      operationId: updateCoupon
      tags: [admin]
      summary: Update a discount code
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponInput" }
      responses:
        "200":
          description: Updated coupon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponDetail" }
        "404": { description: Not found }
    delete:
      operationId: deleteCoupon
      tags: [admin]
      summary: Delete a discount code and its redemption history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/coupons/{id}/redemptions:
    get:
      operationId: listCouponRedemptions
      tags: [admin]
      summary: Every booking that used this code
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Redemptions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CouponRedemptionDetail" } }
        "404": { description: Not found }
  /tours/{slug}/rate-card:
    get:
      operationId: getTourRateCard
      tags: [content]
      summary: Participant types, volume tiers and add-ons for a tour
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rate card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
        "404": { description: Tour not found }
  /quote:
    post:
      operationId: quoteBooking
      tags: [booking]
      summary: Price a prospective booking without creating it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteResult" }
        "400": { description: Invalid selection }
        "404": { description: Slot not found }
  /admin/tours/{id}/rate-card:
    get:
      operationId: getAdminTourRateCard
      tags: [admin]
      summary: Rate card for editing, including inactive rows
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rate card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
        "404": { description: Tour not found }
    put:
      operationId: saveTourRateCard
      tags: [admin]
      summary: Replace a tour's participant types, tiers and add-ons
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateCardInput" }
      responses:
        "200":
          description: Saved rate card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
        "400": { description: Invalid input }
        "404": { description: Tour not found }
  /auth/firebase-config:
    get:
      operationId: getFirebaseConfig
      tags: [content]
      summary: Public Firebase web config, or null when not configured
      description: Served at runtime rather than baked into the bundle, so the same build works across environments. These values identify the project; they authorise nothing.
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirebaseConfigResponse" }
  /admin/auth/firebase:
    post:
      operationId: adminFirebaseLogin
      tags: [admin]
      summary: Exchange a Firebase ID token for an admin session
      description: The email must already belong to an active staff account. Signing in with Firebase never creates one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirebaseTokenInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { description: The Firebase token is invalid or the email is unverified }
        "403": { description: No active staff account uses that email }
        "503": { description: Firebase sign-in is not configured on this server }
  /agent/auth/firebase:
    post:
      operationId: agentFirebaseLogin
      tags: [agent]
      summary: Exchange a Firebase ID token for an agent session
      description: The email must already belong to an active agent. Signing in with Firebase never creates one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirebaseTokenInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionResponse" }
        "401": { description: The Firebase token is invalid or the email is unverified }
        "403": { description: "No active agent uses that email" }
        "503": { description: Firebase sign-in is not configured on this server }
  /agent/auth/login:
    post:
      operationId: agentLogin
      tags: [agent]
      summary: Sign in to the agent portal
      description: A separate credential realm from the admin console. An agent token never authenticates an admin request, and vice versa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentLoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionResponse" }
        "401": { description: Wrong email or password }
        "403": { description: "The account is not active, or has no password set yet" }
  /agent/auth/logout:
    post:
      operationId: agentLogout
      tags: [agent]
      summary: End the agent's session
      responses:
        "204": { description: Signed out }
  /agent/auth/me:
    get:
      operationId: agentMe
      tags: [agent]
      summary: The signed-in agent
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSelf" }
        "401": { description: Not signed in }
  /agent/auth/accept-invite:
    post:
      operationId: agentAcceptInvite
      tags: [agent]
      summary: Set a password from an invitation link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAcceptInviteInput" }
      responses:
        "200":
          description: Password set and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionResponse" }
        "400": { description: Password too short }
        "410": { description: "The invitation has expired or been used" }
  /agent/auth/invite-status:
    get:
      operationId: agentInviteStatus
      tags: [agent]
      summary: Check an invitation before showing the password form
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Who the invitation is for
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  email: { type: string }
                  company: { type: string, nullable: true }
                required: [name, email]
        "410": { description: "The invitation has expired or been used" }
  /agent/auth/password:
    post:
      operationId: agentChangePassword
      tags: [agent]
      summary: Change the signed-in agent's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentChangePasswordInput" }
      responses:
        "204": { description: "Changed; all other sessions are ended" }
        "400": { description: Password too short }
        "401": { description: Current password is wrong }
  /agent/summary:
    get:
      operationId: agentSummary
      tags: [agent]
      summary: The agent's own totals
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPortalSummary" }
        "401": { description: Not signed in }
  /agent/bookings:
    get:
      operationId: agentBookings
      tags: [agent]
      summary: Bookings credited to the signed-in agent
      description: Always scoped to the caller. There is no parameter for choosing an agent.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentBookingRow" } }
        "401": { description: Not signed in }
  /admin/agents:
    get:
      operationId: listAgents
      tags: [admin]
      summary: Travel agents and resellers, with what they have sent you
      parameters:
        - { name: status, in: query, required: false, schema: { type: string }, description: "invited | active | inactive" }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Name, company, email, phone or city" }
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentDetail" } }
    post:
      operationId: createAgent
      tags: [admin]
      summary: Invite an agent by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { description: Invalid input }
        "409": { description: An agent already exists with that email }
  /admin/agents/{id}:
    get:
      operationId: getAgent
      tags: [admin]
      summary: One agent, with every booking credited to them
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWithBookings" }
        "404": { description: Not found }
    patch:
      operationId: updateAgent
      tags: [admin]
      summary: Change an agent's details or status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPatchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400": { description: Invalid input }
        "404": { description: Not found }
        "409": { description: An agent already exists with that email }
    delete:
      operationId: deleteAgent
      tags: [admin]
      summary: Remove an agent who has never been credited with a booking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
        "409": { description: The agent has bookings; deactivate instead }
  /admin/agents/{id}/invite:
    post:
      operationId: inviteAgent
      tags: [admin]
      summary: Create a portal invitation link for an agent
      description: Replaces any outstanding invitation. The link is emailed to the agent and also returned so it can be sent by hand.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteUrl: { type: string }
                  expiresAt: { type: string }
                  emailed: { type: boolean, description: "False when no mail provider is configured" }
                required: [inviteUrl, expiresAt, emailed]
        "404": { description: Not found }
        "409": { description: The agent is inactive }
  /admin/operations:
    get:
      operationId: getOperations
      tags: [admin]
      summary: Departures in a date range, with who is on each
      description: Powers the operational dashboard's list, weekly and monthly views.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "YYYY-MM-DD" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "YYYY-MM-DD" }
      responses:
        "200":
          description: Departures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsRange" }
        "400": { description: Bad date range }
  /admin/booking-search:
    get:
      operationId: searchBookings
      tags: [admin]
      summary: Find a booking by reference or any passenger detail
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BookingSearchHit" } }
  /admin/tours/{id}/variants:
    get:
      operationId: getTourVariants
      tags: [admin]
      summary: Ways of doing this trip, including inactive ones
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourVariantsResponse" }
        "404": { description: Tour not found }
    put:
      operationId: saveTourVariants
      tags: [admin]
      summary: Replace a trip's variants
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTourVariantsInput" }
      responses:
        "200":
          description: Saved variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourVariantsResponse" }
        "400": { description: Invalid input }
        "404": { description: Tour not found }
        "409": { description: A variant with bookings cannot be removed outright }
  /admin/tours/{id}/booking-fields:
    get:
      operationId: getTourBookingFields
      tags: [admin]
      summary: Extra questions asked when booking this trip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourBookingFieldsResponse" }
        "404": { description: Tour not found }
    put:
      operationId: saveTourBookingFields
      tags: [admin]
      summary: Replace a trip's extra booking fields
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTourBookingFieldsInput" }
      responses:
        "200":
          description: Saved fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourBookingFieldsResponse" }
        "400": { description: Invalid input }
        "404": { description: Tour not found }
  /admin/tours/{id}/overview:
    get:
      operationId: getTourOverview
      tags: [admin]
      summary: Rates, settings, departures and live URLs for one trip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourOverview" }
        "404": { description: Tour not found }
  /admin/tours/{id}/calendar/{month}:
    get:
      operationId: getTourCalendar
      tags: [admin]
      summary: One month of departures for this trip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: month, in: path, required: true, schema: { type: string }, description: "YYYY-MM" }
      responses:
        "200":
          description: Month
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TourCalendarMonth" }
        "400": { description: Bad month }
        "404": { description: Tour not found }
  /admin/tour-slots/{slotId}/override:
    patch:
      operationId: overrideTourSlot
      tags: [admin]
      summary: Change one departure's capacity or close it
      parameters:
        - { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlotOverrideInput" }
      responses:
        "204": { description: Updated }
        "400": { description: Invalid input }
        "404": { description: Slot not found }
        "409": { description: Capacity below what is already booked }
  /track:
    post:
      operationId: trackEvent
      tags: [content]
      summary: Record an anonymous analytics event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackInput" }
      responses:
        "204": { description: "Recorded — always 204, even when the event is dropped" }
  /admin/analytics:
    get:
      operationId: getAnalytics
      tags: [admin]
      summary: Traffic and conversion overview
      parameters:
        - { name: from, in: query, required: false, schema: { type: string }, description: "YYYY-MM-DD, defaults to 30 days ago" }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsOverview" }
        "401": { description: Not authenticated }
  /admin/reports:
    get:
      operationId: listReportTypes
      tags: [admin]
      summary: Available report types
      responses:
        "200":
          description: Report definitions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReportMeta" } }
        "401": { description: Not authenticated }
  /admin/reports/run:
    get:
      operationId: runReport
      tags: [admin]
      summary: Run a report
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: tourId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: couponCode, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "404": { description: Unknown report }
  /admin/reports/export.csv:
    get:
      operationId: exportReportCsv
      tags: [admin]
      summary: Download a report as CSV
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: tourId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: couponCode, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "404": { description: Unknown report }
  /admin/scheduled-reports:
    get:
      operationId: listScheduledReports
      tags: [admin]
      summary: Reports that email themselves on a schedule
      responses:
        "200":
          description: Scheduled reports
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScheduledReport" } }
        "401": { description: Not authenticated }
    post:
      operationId: createScheduledReport
      tags: [admin]
      summary: Schedule a report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduledReportInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledReport" }
        "400": { description: Invalid input }
  /admin/scheduled-reports/{id}:
    patch:
      operationId: updateScheduledReport
      tags: [admin]
      summary: Update a scheduled report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduledReportInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledReport" }
        "404": { description: Not found }
    delete:
      operationId: deleteScheduledReport
      tags: [admin]
      summary: Delete a scheduled report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/scheduled-reports/{id}/run:
    post:
      operationId: runScheduledReportNow
      tags: [admin]
      summary: Send a scheduled report immediately, as a test
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Sending }
        "404": { description: Not found }
  /search:
    get:
      operationId: searchSite
      tags: [content]
      summary: Search published tours, destinations, posts and pages
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
  /admin/roles:
    get:
      operationId: listRoles
      tags: [admin]
      summary: Roles and what each can do
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RoleInfo" } }
        "403": { description: Not permitted }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Staff accounts
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUserDetail" } }
        "403": { description: Not permitted }
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Add a staff account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "409": { description: Email already in use }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Change a staff account's name, role, password or status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "409": { description: "Would remove the last owner, or targets yourself" }
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Remove a staff account
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { description: "Would remove the last owner, or targets yourself" }
  /payment-methods:
    get:
      operationId: getPaymentMethods
      tags: [content]
      summary: Payment methods offered at checkout, and whether any charge depends on the choice
      parameters:
        - { name: tour, in: query, required: false, schema: { type: string }, description: "Tour slug" }
      responses:
        "200":
          description: Methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethodOptions" }
  /admin/charges:
    get:
      operationId: listAdminCharges
      tags: [admin]
      summary: Taxes and fees, including expired ones
      responses:
        "200":
          description: Charges
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChargeDetail" } }
    put:
      operationId: saveCharges
      tags: [admin]
      summary: Replace the charge list
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: "#/components/schemas/ChargeDetail" } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChargeDetail" } }
        "400": { description: Invalid input }
  /admin/charges/health:
    get:
      operationId: getChargeHealth
      tags: [admin]
      summary: Charges that have expired or are about to
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeHealth" }
  /admin/redirects:
    get:
      operationId: listRedirects
      tags: [admin]
      summary: URL redirects, with any chains flagged
      responses:
        "200":
          description: Redirects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectList" }
    post:
      operationId: createRedirect
      tags: [admin]
      summary: Add a redirect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedirectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectDetail" }
        "409": { description: That path already redirects }
  /admin/redirects/{id}:
    patch:
      operationId: updateRedirect
      tags: [admin]
      summary: Update a redirect
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedirectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectDetail" }
        "404": { description: Not found }
    delete:
      operationId: deleteRedirect
      tags: [admin]
      summary: Delete a redirect
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/media:
    get:
      operationId: listMedia
      tags: [admin]
      summary: Media library, with a usage count per file
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "Match filename or URL" }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [image, video] } }
      responses:
        "200":
          description: Media assets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
        "401": { description: Not authenticated }
  /admin/media/{id}:
    delete:
      operationId: deleteMedia
      tags: [admin]
      summary: Delete a file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { description: Still in use }
        "404": { description: Not found }
  /admin/media/{id}/force:
    delete:
      operationId: forceDeleteMedia
      tags: [admin]
      summary: Delete a file even though it is still referenced
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /booking-intent:
    post:
      operationId: reportBookingIntent
      tags: [booking]
      summary: Tell the team someone has started filling the booking form
      description: >
        Fire-and-forget lead alert. Always answers 202 — whether an alert was
        actually sent depends on the admin switch, deduplication and rate
        limiting, and the caller has no business knowing which.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingIntentInput" }
      responses:
        "202": { description: Accepted }
        "400": { description: Invalid input }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin, manager, finance, editor, viewer]
        capabilities:
          type: array
          items: { type: string }
          description: "What this role may change — the UI hides anything absent here"
        token:
          type: string
          nullable: true
      required:
        - id
        - email
        - role
    Destination:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        fullName: { type: string, nullable: true }
        tagline: { type: string, nullable: true }
        description: { type: string, nullable: true }
        heroImage: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        highlights: { type: array, items: { type: string } }
        bestTime: { type: string, nullable: true }
        distance: { type: string, nullable: true }
        mapEmbed: { type: string, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        status: { type: string, enum: [draft, published] }
        sortOrder: { type: integer }
      required: [id, slug, name, images, highlights]
    Tour:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        destinationId: { type: string, nullable: true }
        type: { type: string, description: "Slug of a tour type (see /tour-types)" }
        category: { type: string, description: "Slug of a tour category (see /tour-categories)" }
        title: { type: string }
        location: { type: string, nullable: true }
        tagline: { type: string, nullable: true }
        description: { type: string, nullable: true }
        heroImage: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        priceValue: { type: integer }
        currency: { type: string }
        duration: { type: string, nullable: true }
        capacityPerSlot: { type: integer }
        bookingMode: { type: string, enum: [direct, enquiry], description: "direct = pay online now; enquiry = no payment, team confirms manually" }
        minAge: { type: integer, nullable: true }
        maxWeightKg: { type: integer, nullable: true }
        season: { type: string, nullable: true }
        difficulty: { type: string, nullable: true }
        highlights: { type: array, items: { type: string } }
        included: { type: array, items: { type: string } }
        excluded: { type: array, items: { type: string } }
        details: { type: object, additionalProperties: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        status: { type: string, enum: [draft, published] }
        sortOrder: { type: integer }
        code: { type: string, nullable: true, description: "Operator-facing trip code, e.g. ACE-CampKarle" }
        sharedTrip: { type: boolean, description: "false = a private departure not pooled with other customers" }
        minParticipants: { type: integer, nullable: true }
        maxParticipants: { type: integer, nullable: true }
        terms: { type: string, nullable: true, description: "Terms for this trip only" }
        advertisedPrice: { type: integer, nullable: true, description: "Headline price for display; the rate card does the maths" }
        priceLabelPosition: { type: string, enum: [before, after, none] }
        priceLabel: { type: string, nullable: true, description: "The label's own words, e.g. Starting from / Per Person. Null = site defaults." }
        showAdvertisedPrice: { type: boolean }
        showGroupRates: { type: boolean, description: "List the group rates on the trip page" }
        allowPartialDeposit: { type: boolean }
        depositPercent: { type: integer, description: "Percent of the total accepted as a deposit" }
        seatSharing: { type: string, enum: [independent, reduces, closes] }
        departureDisplay: { type: string, enum: [calendar, list] }
        showSeatsAvailable: { type: boolean }
        showSeatsBooked: { type: boolean }
        showGuaranteedDeparture: { type: boolean }
        showSeatsToGuarantee: { type: boolean }
        bookingLeadTimeHours: { type: integer }
        paymentDeadlineDays: { type: integer, nullable: true }
        itinerary: { type: array, items: { $ref: "#/components/schemas/ItineraryDay" } }
        itineraryText: { type: string, nullable: true }
        latitude: { type: string, nullable: true }
        longitude: { type: string, nullable: true }
        shortAddress: { type: string, nullable: true }
        detailedAddress: { type: string, nullable: true }
        directions: { type: string, nullable: true }
        confirmationEmailIntro: { type: string, nullable: true }
        labels: { type: object, additionalProperties: { type: string }, description: "Custom nouns: trip, departure, participant, room" }
        relatedTourIds: { type: array, items: { type: string } }
        ogTitle: { type: string, nullable: true }
        ogDescription: { type: string, nullable: true }
        ogImage: { type: string, nullable: true }
      required: [id, slug, type, title, images, priceValue, currency, capacityPerSlot, highlights, included, excluded]
    BlogPostSummary:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        coverImage: { type: string, nullable: true }
        author: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        readTime: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        status: { type: string, enum: [draft, published] }
      required: [id, slug, title, tags]
    BlogPost:
      allOf:
        - $ref: "#/components/schemas/BlogPostSummary"
        - type: object
          properties:
            body: { type: string, nullable: true }
            seoTitle: { type: string, nullable: true }
            seoDescription: { type: string, nullable: true }
    GalleryItem:
      type: object
      properties:
        id: { type: string }
        src: { type: string }
        alt: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        category: { type: string }
        tall: { type: boolean }
        sortOrder: { type: integer }
        published: { type: boolean }
        layoutX: { type: integer, nullable: true }
        layoutY: { type: integer, nullable: true }
        layoutW: { type: integer, nullable: true }
        layoutH: { type: integer, nullable: true }
      required: [id, src, category, tall, sortOrder]
    DestinationInput:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        fullName: { type: string, nullable: true }
        tagline: { type: string, nullable: true }
        description: { type: string, nullable: true }

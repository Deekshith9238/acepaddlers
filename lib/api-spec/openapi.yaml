        "401": { description: Not authenticated }
  /admin/customers/merge:
    post:
      operationId: mergeCustomers
      tags: [crm]
      summary: Merge one customer record into another
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerMergeInput" }
      responses:
        "200":
          description: Surviving customer

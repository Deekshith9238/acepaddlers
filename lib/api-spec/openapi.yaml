            application/json:
              schema: { $ref: "#/components/schemas/CustomerDetail" }
        "404": { description: Not found }
  /admin/customers/{id}:
    get:
      operationId: getCustomer
      tags: [crm]
      summary: One customer with their booking and enquiry history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "404": { description: Not found }
    patch:
      operationId: updateCustomer
      tags: [crm]
      summary: Update a customer record
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerDetail" }
        "404": { description: Not found }
    delete:
      operationId: deleteCustomer
      tags: [crm]
      summary: Delete a customer record (bookings and enquiries are kept, unlinked)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /admin/bookings/export.csv:
    get:
      operationId: exportBookingsCsv
      tags: [admin]
      summary: Export the filtered booking list as CSV
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: paymentStatus, in: query, required: false, schema: { type: string } }
        - { name: source, in: query, required: false, schema: { type: string } }
        - { name: tourId, in: query, required: false, schema: { type: string } }
        - { name: bookedFrom, in: query, required: false, schema: { type: string } }
        - { name: bookedTo, in: query, required: false, schema: { type: string } }
        - { name: departsFrom, in: query, required: false, schema: { type: string } }
        - { name: departsTo, in: query, required: false, schema: { type: string } }
        - { name: balanceDue, in: query, required: false, schema: { type: boolean } }
        - { name: category, in: query, required: false, schema: { type: string }, description: "Tour category slug — VL's \"collections\"" }
        - { name: variantId, in: query, required: false, schema: { type: string } }
        - { name: paymentMethod, in: query, required: false, schema: { type: string } }
        - { name: agentId, in: query, required: false, schema: { type: string }, description: "An agent id, or \"none\" for direct bookings" }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Not authenticated }
  /admin/bookings/{id}/payments:
    get:
      operationId: getBookingLedger
      tags: [admin]
      summary: Every payment and refund recorded against one booking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingLedger" }
        "404": { description: Not found }
    post:
      operationId: recordBookingPayment
      tags: [admin]
      summary: Record a payment or refund taken outside the gateway
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPaymentInput" }
      responses:
        "201":
          description: Updated ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingLedger" }
        "400": { description: Invalid input }
        "404": { description: Not found }
  /admin/bookings/{id}/payments/razorpay-sync:
    post:
      operationId: syncBookingWithRazorpay
      tags: [admin]
      summary: Ask Razorpay for the real state of this booking's orders and payment links, and update the ledger to match
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What Razorpay reported for each gateway row, and the updated ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpaySyncResult" }
        "404": { description: Not found }
        "501": { description: Razorpay is not configured on this server }
  /admin/bookings/{id}/payments/{paymentId}:
    delete:
      operationId: deleteBookingPayment
      tags: [admin]
      summary: Remove a manually recorded ledger entry (gateway rows cannot be deleted)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: paymentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingLedger" }
        "409": { description: Not a manual entry }
        "404": { description: Not found }
  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [booking]
      summary: Preview a discount code against a prospective booking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponCheckInput" }
      responses:
        "200":
          description: Result — `ok` false carries a reason rather than an error status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponCheckResult" }
        "400": { description: Invalid input }
  /admin/coupons:
    get:
      operationId: listCoupons
